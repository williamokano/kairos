name: logs-follow

nodes:
  - id: n1
    actor: rule
    output: { x: "string" }

  - id: n2
    actor: shell
    sideEffectFree: true
    prompt: |
      sleep 1
      echo '{"done":true}' > "$KAIROS_OUTPUT_PATH"
    output: { done: "bool!" }

  - id: n3
    actor: rule
    output: { x: "string" }
